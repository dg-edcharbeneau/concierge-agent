<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 960" width="990" height="960" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Concierge Agent architecture</title>
  <desc id="arch-desc">System map. Browser chat, browser voice and the room device enter Concierge.Web through the AG-UI endpoint, the voice relay with Deepgram and the Think endpoint, or the guest REST API. ConciergeService sends every turn as a SubmitTurn Update through Temporal to the guest's ConciergeStayWorkflow in the workflow server. Its activities call the AI models, Geoapify, Open-Meteo and Postgres, and call the ride service over HTTP. Partial answer text streams back to Web through Postgres LISTEN/NOTIFY, and ride status returns through the stay's Workflow Stream.</desc>
  <style>
    :root {
      --surface: #FFFFFF; --band: #E7E9F1; --line: #CDD1DE; --fg: #14151A; --muted: #545A6C;
      --edge: #3F4454; --uv: #444CE7; --on-uv: #FFFFFF; --uv-wash: #E6E7FC; --glass: #00B2FF;
      --on-glass: #06121A; --glass-wash: #DCF3FF; --hot: #7F39FF; --on-hot: #FFFFFF;
      --ink: #14151A; --on-ink: #F3F4F8;
      --font-body: "Work Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      --font-mono: "Azeret Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1A1B21; --band: #16171D; --line: #2F313B; --fg: #F1F2F6; --muted: #A3A8B6;
        --edge: #B9BDCA; --uv-wash: #1E2046; --glass-wash: #0A2838; --hot: #E042FF; --on-hot: #14151A;
        --ink: #F1F2F6; --on-ink: #0E0F13;
      }
    }
    .bg { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .band { fill: var(--band); }
    .n { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
    .n-ext { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
    .n-dg { fill: var(--glass); }
    .n-dg-soft { fill: var(--glass-wash); stroke: var(--glass); stroke-width: 1.5; }
    .n-tp { fill: var(--uv); }
    .n-tp-soft { fill: var(--uv-wash); stroke: var(--uv); stroke-width: 1.5; }
    .n-ink { fill: var(--ink); }
    .e { fill: none; stroke: var(--edge); stroke-width: 1.6; }
    .e-hot { fill: none; stroke: var(--hot); stroke-width: 2; stroke-dasharray: 6 4; }
    .ahf { fill: var(--edge); }
    .ahf-hot { fill: var(--hot); }
    .t { fill: var(--fg); font-family: var(--font-body); font-size: 13px; font-weight: 600; }
    .t-on-glass { fill: var(--on-glass); }
    .t-on-uv { fill: var(--on-uv); }
    .t-on-ink { fill: var(--on-ink); }
    .s { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
    .s-on-glass { fill: var(--on-glass); }
    .s-on-uv { fill: var(--on-uv); opacity: 0.88; }
    .s-on-ink { fill: var(--on-ink); opacity: 0.8; }
    .lbl { fill: var(--muted); font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; }
    .lbl-hot { fill: var(--hot); font-weight: 600; }
    .zl { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.12em; }
    .pill { fill: var(--surface); stroke: var(--edge); stroke-width: 1.2; }
    .pt { fill: var(--fg); font-family: var(--font-mono); font-size: 10px; font-weight: 500; }
    .bdg { fill: var(--hot); }
    .bdt { fill: var(--on-hot); font-family: var(--font-body); font-size: 11.5px; font-weight: 800; }
    .lg { fill: var(--fg); font-family: var(--font-body); font-size: 13px; font-weight: 600; }
    .lg-dim { fill: var(--muted); font-weight: 400; }
    .sw-app { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .sw-ext { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 2; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="989" height="959" rx="18"/>

  <!-- Legend -->
  <g aria-label="Legend">
    <rect class="n-dg" x="24" y="22" width="16" height="16" rx="4"/>
    <text class="lg" x="48" y="35">Deepgram<tspan class="lg-dim"> hears and speaks</tspan></text>
    <rect class="n-tp" x="256" y="22" width="16" height="16" rx="4"/>
    <text class="lg" x="280" y="35">Temporal<tspan class="lg-dim"> runs and remembers each stay</tspan></text>
    <rect class="sw-app" x="566" y="22.5" width="15" height="15" rx="4"/>
    <text class="lg" x="590" y="35">Concierge app<tspan class="lg-dim"> .NET 11, wired by Aspire</tspan></text>
    <rect class="sw-ext" x="24.5" y="50.5" width="15" height="15" rx="4"/>
    <text class="lg" x="48" y="63">Outside services<tspan class="lg-dim"> models, maps, weather</tspan></text>
    <circle class="bdg" cx="372" cy="58" r="8"/>
    <text class="lg" x="388" y="63">Steps<tspan class="lg-dim"> the life of one turn</tspan></text>
  </g>

  <!-- Diagram -->
  <g transform="translate(20 88)">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="ahf"/>
          </marker>
          <marker id="ah-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="ahf-hot"/>
          </marker>
        </defs>

        <!-- Zone labels -->
        <text class="zl" x="20" y="26">GUESTS</text>
        <text class="zl" x="710" y="26">VOICE AI</text>

        <!-- Row 1: clients + Deepgram -->
        <rect class="n" x="20" y="40" width="210" height="56" rx="10"/>
        <text class="t" x="125" y="64" text-anchor="middle">Browser chat</text>
        <text class="s" x="125" y="82" text-anchor="middle">types a question</text>

        <rect class="n" x="250" y="40" width="210" height="56" rx="10"/>
        <text class="t" x="355" y="64" text-anchor="middle">Room device</text>
        <text class="s" x="355" y="82" text-anchor="middle">ESP32 companion</text>

        <rect class="n" x="480" y="40" width="210" height="56" rx="10"/>
        <text class="t" x="585" y="64" text-anchor="middle">Browser voice</text>
        <text class="s" x="585" y="82" text-anchor="middle">mic + speaker</text>

        <rect class="n-dg" x="710" y="40" width="210" height="56" rx="10"/>
        <text class="t t-on-glass" x="815" y="64" text-anchor="middle">Deepgram Voice Agent</text>
        <text class="s s-on-glass" x="815" y="82" text-anchor="middle">speech-to-text · TTS</text>

        <!-- Concierge.Web band: drawn before the incoming edges so it doesn't cover their arrowheads -->
        <rect class="band" x="10" y="158" width="920" height="190" rx="14"/>
        <text class="zl" x="141" y="175">CONCIERGE.WEB</text>

        <!-- Row 1 → Row 2 edges -->
        <path class="e" d="M125,96 V184" marker-end="url(#ah)"/>
        <text class="lbl" x="133" y="144">text</text>

        <path class="e" d="M355,96 V184" marker-end="url(#ah)"/>
        <rect class="pill" x="310" y="129" width="90" height="20" rx="10"/>
        <text class="pt" x="355" y="143" text-anchor="middle">dev tunnel</text>
        <text class="lbl" x="408" y="143">opt-in</text>

        <path class="e" d="M585,96 V184" marker-start="url(#ah)" marker-end="url(#ah)"/>
        <text class="lbl" x="577" y="143" text-anchor="end">audio</text>

        <path class="e" d="M676,184 L724,96" marker-start="url(#ah)" marker-end="url(#ah)"/>
        <text class="lbl" x="706" y="177">session</text>

        <path class="e" d="M815,96 V184" marker-end="url(#ah)"/>
        <rect class="pill" x="770" y="129" width="90" height="20" rx="10"/>
        <text class="pt" x="815" y="143" text-anchor="middle">dev tunnel</text>
        <text class="lbl" x="868" y="143">think</text>

        <rect class="n" x="20" y="184" width="210" height="56" rx="10"/>
        <text class="t" x="125" y="208" text-anchor="middle">AG-UI chat</text>
        <text class="s" x="125" y="226" text-anchor="middle">/agui/concierge</text>

        <rect class="n" x="250" y="184" width="210" height="56" rx="10"/>
        <text class="t" x="355" y="208" text-anchor="middle">Guest REST API</text>
        <text class="s" x="355" y="226" text-anchor="middle">/api/concierge/*</text>

        <rect class="n-dg-soft" x="480" y="184" width="210" height="56" rx="10"/>
        <text class="t" x="585" y="208" text-anchor="middle">Voice relay</text>
        <text class="s" x="585" y="226" text-anchor="middle">/api/concierge/voice</text>

        <rect class="n-dg-soft" x="710" y="184" width="210" height="56" rx="10"/>
        <text class="t" x="815" y="208" text-anchor="middle">Think endpoint</text>
        <text class="s" x="815" y="226" text-anchor="middle">/v1/chat/completions</text>

        <path class="e" d="M125,240 V280" marker-end="url(#ah)"/>
        <text class="lbl" x="133" y="264">turn</text>
        <path class="e" d="M355,240 V280" marker-end="url(#ah)"/>
        <text class="lbl" x="363" y="264">turn</text>
        <path class="e" d="M815,240 V280" marker-end="url(#ah)"/>
        <text class="lbl" x="823" y="264">turn</text>

        <rect class="n-ink" x="20" y="280" width="900" height="52" rx="10"/>
        <text class="t t-on-ink" x="470" y="302" text-anchor="middle">ConciergeService</text>
        <text class="s s-on-ink" x="470" y="320" text-anchor="middle">Temporal client · the one path every channel takes into a stay</text>

        <!-- Web ↔ Temporal -->
        <path class="e" d="M300,332 V390" marker-end="url(#ah)"/>
        <text class="lbl" x="308" y="365">SubmitTurn Update</text>
        <path class="e" d="M560,390 V332" marker-end="url(#ah)"/>
        <text class="lbl" x="568" y="365">ride feed stream</text>

        <!-- Temporal -->
        <rect class="n-tp" x="20" y="390" width="900" height="50" rx="10"/>
        <text class="t t-on-uv" x="470" y="411" text-anchor="middle">Temporal</text>
        <text class="s s-on-uv" x="470" y="428" text-anchor="middle">durable execution · Updates · Workflow Streams</text>

        <!-- Worker groups -->
        <rect class="band" x="10" y="480" width="590" height="232" rx="14"/>
        <text class="zl" x="22" y="498">WORKFLOWSERVER</text>
        <rect class="band" x="620" y="480" width="310" height="232" rx="14"/>
        <text class="zl" x="632" y="498">RIDESERVICE</text>

        <path class="e" d="M176,440 V510" marker-end="url(#ah)"/>
        <text class="lbl" x="184" y="466">runs</text>
        <path class="e" d="M463,440 V510" marker-end="url(#ah)"/>
        <text class="lbl" x="471" y="466">at startup</text>
        <path class="e" d="M745,510 V440" marker-end="url(#ah)"/>
        <text class="lbl" x="737" y="466" text-anchor="end">update-with-start</text>
        <path class="e" d="M850,440 V510" marker-start="url(#ah)" marker-end="url(#ah)"/>
        <text class="lbl" x="858" y="466">ride feed</text>

        <rect class="n-tp-soft" x="26" y="510" width="300" height="64" rx="10"/>
        <text class="t" x="176" y="537" text-anchor="middle">ConciergeStayWorkflow</text>
        <text class="s" x="176" y="556" text-anchor="middle">one per stay · memory · tool loop</text>

        <rect class="n-tp-soft" x="342" y="510" width="242" height="64" rx="10"/>
        <text class="t" x="463" y="537" text-anchor="middle">HotelSetupWorkflow</text>
        <text class="s" x="463" y="556" text-anchor="middle">seeds stays · indexes .md files</text>

        <path class="e" d="M176,574 V606" marker-end="url(#ah)"/>
        <text class="lbl" x="184" y="594">schedules</text>
        <path class="e" d="M463,574 V606" marker-end="url(#ah)"/>

        <rect class="n" x="26" y="606" width="558" height="84" rx="10"/>
        <text class="t" x="305" y="634" text-anchor="middle">Activities</text>
        <text class="s" x="305" y="654" text-anchor="middle">model call · knowledge search · weather · places · routes · transcript</text>
        <text class="s" x="305" y="672" text-anchor="middle">each one retried and recorded by Temporal</text>

        <rect class="n" x="636" y="510" width="135" height="64" rx="10"/>
        <text class="t" x="703.5" y="537" text-anchor="middle">Ride API</text>
        <text class="s" x="703.5" y="556" text-anchor="middle">/rides</text>

        <rect class="n-tp-soft" x="783" y="510" width="135" height="64" rx="10"/>
        <text class="t" x="850.5" y="537" text-anchor="middle">Ride workflow</text>
        <text class="s" x="850.5" y="556" text-anchor="middle">RideBookingWorkflow</text>

        <path class="e" d="M584,648 H703 V574" marker-end="url(#ah)"/>
        <text class="lbl" x="610" y="666">ride tools · HTTP</text>

        <path class="e" d="M850,574 V750" marker-end="url(#ah)"/>
        <text class="lbl" x="858" y="664">stores</text>

        <!-- Activities → services & data -->
        <path class="e" d="M93,690 V750" marker-end="url(#ah)"/>
        <text class="lbl" x="101" y="724">chat + embed</text>
        <path class="e" d="M234,690 V750" marker-end="url(#ah)"/>
        <text class="lbl" x="242" y="724">HTTP</text>
        <path class="e" d="M375,690 V750" marker-end="url(#ah)"/>
        <text class="lbl" x="383" y="724">HTTP</text>
        <path class="e" d="M516,690 V750" marker-end="url(#ah)"/>
        <text class="lbl lbl-hot" x="524" y="724">pg_notify</text>

        <rect class="n-ext" x="26" y="750" width="135" height="56" rx="10"/>
        <text class="t" x="93.5" y="774" text-anchor="middle">AI models</text>
        <text class="s" x="93.5" y="792" text-anchor="middle">Ollama or Foundry</text>

        <rect class="n-ext" x="167" y="750" width="135" height="56" rx="10"/>
        <text class="t" x="234.5" y="774" text-anchor="middle">Geoapify</text>
        <text class="s" x="234.5" y="792" text-anchor="middle">places · routes</text>

        <rect class="n-ext" x="308" y="750" width="135" height="56" rx="10"/>
        <text class="t" x="375.5" y="774" text-anchor="middle">Open-Meteo</text>
        <text class="s" x="375.5" y="792" text-anchor="middle">weather</text>

        <rect class="n" x="449" y="750" width="135" height="56" rx="10"/>
        <text class="t" x="516.5" y="774" text-anchor="middle">Postgres</text>
        <text class="s" x="516.5" y="792" text-anchor="middle">concierge · pgvector</text>

        <rect class="n" x="783" y="750" width="135" height="56" rx="10"/>
        <text class="t" x="850.5" y="774" text-anchor="middle">Postgres</text>
        <text class="s" x="850.5" y="792" text-anchor="middle">rides</text>

        <!-- Answer stream back to Web -->
        <path class="e-hot" d="M516,806 V830 H940 V306 H920" marker-end="url(#ah-hot)"/>
        <text class="lbl lbl-hot" x="728" y="848" text-anchor="middle">answer text streams back · LISTEN / NOTIFY</text>

        <!-- Step badges -->
        <g>
          <circle class="bdg" cx="107" cy="140" r="11"/><text class="bdt" x="107" y="144" text-anchor="middle">1</text>
          <circle class="bdg" cx="797" cy="166" r="11"/><text class="bdt" x="797" y="170" text-anchor="middle">1</text>
          <circle class="bdg" cx="282" cy="361" r="11"/><text class="bdt" x="282" y="365" text-anchor="middle">2</text>
          <circle class="bdg" cx="158" cy="462" r="11"/><text class="bdt" x="158" y="466" text-anchor="middle">3</text>
          <circle class="bdg" cx="158" cy="590" r="11"/><text class="bdt" x="158" y="594" text-anchor="middle">4</text>
          <circle class="bdg" cx="940" cy="570" r="11"/><text class="bdt" x="940" y="574" text-anchor="middle">5</text>
          <circle class="bdg" cx="542" cy="361" r="11"/><text class="bdt" x="542" y="365" text-anchor="middle">6</text>
        </g>
  </g>
</svg>
